name: Sync Versions

on:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'release-please--')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Sync client and gradle versions from root package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Root version is $VERSION"
          npx ts-node scripts/set-version.ts "$VERSION"
          if git diff --quiet; then
            echo "No sync needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/package.json client/android/app/build.gradle docker-compose.yml .env.example
          git commit -m "chore: sync versions to $VERSION"
          git push origin HEAD:${{ github.head_ref }}
