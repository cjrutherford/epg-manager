name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes an older run irrelevant; letting both finish just delays
# the answer that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build server and client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # client/ is a second npm project with its own lockfile. Cache on both,
          # or the client install is uncached on every run.
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - run: npm ci

      # client/ has its own package.json and lockfile, so a root `npm ci` does
      # not install the Angular CLI. Without this, `ng` is simply absent and npx
      # reports "could not determine executable to run". The Dockerfile has
      # always done this; the workflows did not.
      - name: Install client dependencies
        run: npm ci
        working-directory: client

      # Both halves. `npm run build` is the server alone, and the end-to-end
      # suite starts the client's SSR bundle — so a job that builds only the
      # server cannot run it.
      - name: Build server
        run: npm run build

      - name: Build client
        run: npm run build:client

      - name: Upload client bundle
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # client/ is a second npm project with its own lockfile. Cache on both,
          # or the client install is uncached on every run.
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - run: npm ci

      - name: Run unit tests
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  e2e-tests:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # client/ is a second npm project with its own lockfile. Cache on both,
          # or the client install is uncached on every run.
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - run: npm ci

      # No client install here: this job downloads the built bundle, and the SSR
      # output is self-contained. Verified by moving client/node_modules aside
      # and starting server.mjs — it boots and answers.
      # ffmpeg is not optional: the DVR and stream routes shell out to it, and
      # without it those failures look like application bugs.
      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Download client bundle
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Build server
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      # The suite seeds its own database and starts its own servers, so there
      # is nothing to provision here.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload report and failure videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    needs: [unit-tests, e2e-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tuner-daemon:ci .

      # Both ports: the API and the web interface are separate processes, and
      # the healthcheck exists precisely because one can die without the other.
      - name: Start container
        run: |
          docker run -d --name tuner-ci -p 3000:3000 -p 4000:4000 tuner-daemon:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health >/dev/null 2>&1; then break; fi
            sleep 5
          done

      - name: The API answers
        run: curl -fsS http://localhost:4000/api/health

      - name: The web interface answers
        run: curl -fsS -o /dev/null http://localhost:3000/

      - name: The container reports itself healthy
        run: |
          for i in $(seq 1 24); do
            state=$(docker inspect --format='{{.State.Health.Status}}' tuner-ci 2>/dev/null || echo unknown)
            echo "health: $state"
            if [ "$state" = "healthy" ]; then exit 0; fi
            if [ "$state" = "unhealthy" ]; then docker logs tuner-ci; exit 1; fi
            sleep 10
          done
          docker logs tuner-ci
          exit 1

      - name: Container logs
        if: failure()
        run: docker logs tuner-ci || true

      - name: Cleanup
        if: always()
        run: docker rm -f tuner-ci || true

  android:
    name: Package Android APKs
    runs-on: ubuntu-24.04
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) || github.event_name == 'workflow_dispatch'
    needs: [build, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build mobile bundle and sync Capacitor
        run: |
          cd client
          npx ng build --configuration mobile
          npx cap sync android

      - name: Build debug APKs
        if: env.KEYSTORE == ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cd client/android
          ./gradlew assembleMobileDebug assembleTvDebug --no-daemon

      - name: Build signed release APKs
        if: env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd client/android
          echo "$KEYSTORE" | base64 -d > release.keystore
          ./gradlew assembleMobileRelease assembleTvRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f release.keystore

      - name: Package and name APK artifacts
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          short_sha=$(git rev-parse --short HEAD)
          version=$(node -p "require('./package.json').version")
          found=0
          for flavour in mobile tv; do
            for apk in $(find client/android/app/build/outputs/apk/"$flavour" -name "app-${flavour}-*.apk" 2>/dev/null); do
              cp "$apk" "dist-apk/tuner-daemon-${flavour}-v${version}-${short_sha}.apk"
              found=$((found + 1))
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "No APKs were produced." >&2
            find client/android/app/build/outputs -name '*.apk' >&2 || true
            exit 1
          fi
          ls -la dist-apk

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist-apk/*.apk
          retention-days: 30
