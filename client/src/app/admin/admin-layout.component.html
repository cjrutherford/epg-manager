<!-- Login Overlay -->
@if (!isAuthenticated) {
<main class="login-overlay">
    <div class="login-card glass-card">
        <div class="login-logo">
            <img src="assets/tuner-daemon-icon.png" alt="Tuner Daemon" class="mascot-brand-img" style="width: 64px; height: 64px; border-radius: 12px; margin-bottom: 8px;">
            <h1>Tuner Daemon</h1>
            <p>Automated guide & live TV engine</p>
        </div>
        <form (ngSubmit)="login()" class="login-form">
            <input type="password" [(ngModel)]="password" name="password" placeholder="Enter password"
                class="themed-input w-full" aria-label="Password" required autofocus>
            @if (loginError) {
            <div class="login-error">{{ loginError }}</div>
            }
            <button type="submit" class="btn btn-primary w-full">Sign In</button>
        </form>
    </div>
</main>
} @else {
<div class="admin-shell" [class.sidebar-collapsed]="!sidebarOpen">
    <!-- Sidebar -->
    <aside class="sidebar" [class.open]="sidebarOpen" [attr.inert]="isMobile && !sidebarOpen ? '' : null"
        [attr.aria-hidden]="isMobile && !sidebarOpen ? 'true' : null">
        <div class="sidebar-header">
            <div class="brand-logo" style="display: flex; align-items: center; gap: 10px;">
                <img src="assets/tuner-daemon-icon.png" alt="Tuner Daemon" style="width: 32px; height: 32px; border-radius: 6px;">
                <span style="font-weight: 700; letter-spacing: -0.5px;">Tuner Daemon</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a routerLink="dashboard" routerLinkActive="active" class="nav-item">
                <lucide-icon name="layout-dashboard" class="icon icon--lg"></lucide-icon>
                <span>Dashboard</span>
            </a>
            <a routerLink="channels" routerLinkActive="active" class="nav-item">
                <lucide-icon name="video" class="icon icon--lg"></lucide-icon>
                <span>Channels</span>
            </a>
            <a routerLink="sources" routerLinkActive="active" class="nav-item">
                <lucide-icon name="server" class="icon icon--lg"></lucide-icon>
                <span>Sources</span>
            </a>
            <a routerLink="dvr" routerLinkActive="active" class="nav-item">
                <lucide-icon name="clapperboard" class="icon icon--lg"></lucide-icon>
                <span>Recordings</span>
            </a>
            <a routerLink="diagnostics" routerLinkActive="active" class="nav-item">
                <lucide-icon name="calendar-days" class="icon icon--lg"></lucide-icon>
                <span>Guide &amp; matching</span>
            </a>
            <a routerLink="settings" routerLinkActive="active" class="nav-item">
                <lucide-icon name="settings" class="icon icon--lg"></lucide-icon>
                <span>Settings</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <!-- Theme Picker -->
            <div class="sidebar-theme-picker">
                <button class="nav-item" (click)="toggleThemePicker()" [attr.aria-expanded]="themePickerOpen"
                    aria-haspopup="true">
                    <lucide-icon name="palette" class="icon icon--lg"></lucide-icon>
                    <span>Theme</span>
                </button>
                @if (themePickerOpen) {
                <app-theme-menu align="left" placement="up" (selected)="themePickerOpen = false" (closed)="themePickerOpen = false"
                    (click)="$event.stopPropagation()"></app-theme-menu>
                }
            </div>

            <a routerLink="/watch" class="nav-item nav-item-watch">
                <lucide-icon name="play" class="icon icon--lg"></lucide-icon>
                <span>Watch TV</span>
            </a>
            <button class="nav-item danger" (click)="logout()">
                <lucide-icon name="log-out" class="icon icon--lg"></lucide-icon>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Mobile Header -->
        <div class="mobile-header">
            <button class="hamburger" (click)="toggleSidebar()" aria-label="Open navigation">
                <lucide-icon name="menu" class="icon icon--lg"></lucide-icon>
            </button>
            <span class="mobile-title" style="display: flex; align-items: center; gap: 8px;">
                <img src="assets/tuner-daemon-icon.png" alt="Tuner Daemon" style="width: 24px; height: 24px; border-radius: 4px;">
                <span>Tuner Daemon</span>
            </span>
        </div>

        <main class="content-scroll">
            <router-outlet></router-outlet>
        </main>
    </div>

    <!-- Mobile sidebar overlay -->
    @if (sidebarOpen && isMobile) {
    <div class="sidebar-overlay" (click)="sidebarOpen = false"></div>
    }
</div>

}
