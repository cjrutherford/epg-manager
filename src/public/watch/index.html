<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Watch — Live TV</title>
    <meta name="description" content="Watch live IPTV channels with an interactive program guide">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Top Bar -->
    <header id="top-bar">
        <div class="top-bar-left">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="15" rx="2" ry="2" />
                    <polyline points="17 2 12 7 7 2" />
                </svg>
                <span>IPTV</span>
            </div>
            <div id="now-playing-bar" class="now-playing-bar">
                <span id="np-channel" class="np-channel"></span>
                <span id="np-program" class="np-program"></span>
            </div>
        </div>
        <div class="top-bar-right">
            <button id="btn-recordings-toggle" class="icon-btn" title="Recordings (R)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <circle cx="12" cy="12" r="3" fill="currentColor" />
                </svg>
            </button>
            <button id="btn-guide-toggle" class="icon-btn" title="Toggle Guide (G)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6" />
                    <line x1="8" y1="12" x2="21" y2="12" />
                    <line x1="8" y1="18" x2="21" y2="18" />
                    <line x1="3" y1="6" x2="3.01" y2="6" />
                    <line x1="3" y1="12" x2="3.01" y2="12" />
                    <line x1="3" y1="18" x2="3.01" y2="18" />
                </svg>
            </button>
            <google-cast-launcher id="cast-btn" class="icon-btn" title="Cast to device"></google-cast-launcher>
            <a href="/" class="icon-btn" title="Admin Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
            </a>
        </div>
    </header>

    <!-- Content Area: video + info pane side by side in three-pane mode -->
    <div id="content-area" class="content-area">
        <!-- Video Player -->
        <main id="player-area">
            <video id="video-player" autoplay></video>

            <!-- Channel Up/Down Buttons -->
            <div id="channel-controls" class="channel-controls">
                <button id="btn-ch-up" class="ch-btn" title="Channel Up (↑)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <polyline points="6 15 12 9 18 15" />
                    </svg>
                </button>
                <button id="btn-ch-down" class="ch-btn" title="Channel Down (↓)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                </button>
            </div>

            <!-- Volume Controls -->
            <div id="volume-bar" class="volume-bar">
                <button id="btn-mute" class="vol-btn" title="Mute (M)">
                    <svg id="vol-icon-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                    </svg>
                    <svg id="vol-icon-off" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <line x1="23" y1="9" x2="17" y2="15" />
                        <line x1="17" y1="9" x2="23" y2="15" />
                    </svg>
                </button>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="80"
                    title="Volume">
                <span id="volume-pct" class="volume-pct">80%</span>
            </div>

            <!-- Channel OSD (briefly shows channel number) -->
            <div id="channel-osd" class="channel-osd">
                <span id="osd-number" class="osd-number"></span>
                <span id="osd-name" class="osd-name"></span>
            </div>

            <!-- Info Overlay (floating, used in two-pane mode) -->
            <div id="info-overlay" class="info-overlay hidden">
                <div class="info-overlay-content">
                    <img id="info-logo" class="info-logo" src="" alt="">
                    <div class="info-text">
                        <div class="info-channel-name" id="info-channel-name"></div>
                        <div class="info-program-title" id="info-program-title"></div>
                        <div class="info-program-subtitle" id="info-program-subtitle"></div>
                        <div class="info-program-desc" id="info-program-desc"></div>
                        <div class="info-meta">
                            <span id="info-time" class="info-time"></span>
                            <span id="info-category" class="info-category"></span>
                            <span id="info-episode" class="info-episode"></span>
                        </div>
                        <!-- Progress bar for current program -->
                        <div class="info-progress-bar">
                            <div id="info-progress" class="info-progress"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Loading spinner -->
            <div id="player-loading" class="player-loading hidden">
                <div class="spinner"></div>
                <span>Loading stream...</span>
            </div>

            <!-- Error state -->
            <div id="player-error" class="player-error hidden">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="15" y1="9" x2="9" y2="15" />
                    <line x1="9" y1="9" x2="15" y2="15" />
                </svg>
                <span id="error-message">Stream unavailable</span>
            </div>
        </main>

        <!-- Info Pane (sidebar, visible in three-pane mode) -->
        <aside id="info-pane" class="info-pane">
            <div class="info-pane-inner">
                <img id="pane-logo" class="info-pane-logo" src="" alt="">
                <h2 id="pane-channel-name" class="info-pane-channel"></h2>
                <h3 id="pane-program-title" class="info-pane-program"></h3>
                <div id="pane-program-subtitle" class="info-pane-subtitle"></div>
                <div id="pane-program-desc" class="info-pane-desc"></div>
                <div class="info-pane-meta">
                    <span id="pane-time" class="info-pane-time"></span>
                    <span id="pane-category" class="info-pane-category"></span>
                    <span id="pane-episode" class="info-pane-episode"></span>
                </div>
                <div class="info-pane-progress-bar">
                    <div id="pane-progress" class="info-pane-progress"></div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Guide Resize Handle -->
    <div id="guide-resize-handle" class="guide-resize-handle">
        <div class="resize-grip"></div>
    </div>

    <!-- Guide Panel (bottom) -->
    <section id="guide-panel" class="guide-panel">
        <div class="guide-header">
            <div class="guide-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                    <line x1="16" y1="2" x2="16" y2="6" />
                    <line x1="8" y1="2" x2="8" y2="6" />
                    <line x1="3" y1="10" x2="21" y2="10" />
                </svg>
                <span>Program Guide</span>
            </div>
            <div class="guide-time-nav">
                <button id="guide-prev" class="guide-nav-btn" title="Earlier (←)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6" />
                    </svg>
                </button>
                <span id="guide-time-label" class="guide-time-label"></span>
                <button id="guide-now" class="guide-nav-btn guide-now-btn" title="Jump to Now">Now</button>
                <button id="guide-next" class="guide-nav-btn" title="Later (→)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div id="guide-search" class="guide-search">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="search-input" class="search-input" placeholder="Search channels or programs..."
                autocomplete="off">
            <button id="search-clear" class="search-clear hidden" title="Clear search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>

        <!-- Category Tabs (multi-select with icons) -->
        <div id="category-tabs" class="category-tabs">
            <button class="cat-tab active" data-category="all">⭐ All</button>
        </div>

        <!-- Guide Grid -->
        <div id="guide-grid" class="guide-grid">
            <!-- Timeline header -->
            <div id="guide-timeline" class="guide-timeline"></div>
            <!-- Channel rows inserted here -->
            <div id="guide-rows" class="guide-rows"></div>
            <!-- Loading state -->
            <div id="guide-loading" class="guide-loading hidden">
                <div class="spinner small"></div>
                <span>Loading guide data...</span>
            </div>
            <!-- Empty state -->
            <div id="guide-empty" class="guide-empty hidden">
                <span>No channels available</span>
            </div>
        </div>
    </section>

    <!-- Recordings Panel (slide-in sidebar) -->
    <aside id="recordings-panel" class="recordings-panel">
        <div class="rec-panel-header">
            <h3>🔴 Recordings</h3>
            <button id="rec-panel-close" class="icon-btn" title="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div id="rec-list" class="rec-list">
            <div class="rec-empty">No recordings scheduled</div>
        </div>
    </aside>

    <!-- Right-click context menu for guide programs -->
    <div id="program-context-menu" class="context-menu hidden">
        <button id="ctx-record" class="ctx-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <circle cx="12" cy="12" r="4" fill="#ef4444" />
            </svg>
            <span>Record Program</span>
        </button>
        <button id="ctx-tune" class="ctx-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
            <span>Watch Channel</span>
        </button>
        <button id="ctx-favorite" class="ctx-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
            </svg>
            <span id="ctx-favorite-label">★ Favorite</span>
        </button>
        <button id="ctx-hide" class="ctx-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            <span id="ctx-hide-label">👁 Hide Channel</span>
        </button>
    </div>

    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
